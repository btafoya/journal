version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: openjournal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openjournal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openjournal_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-openjournal}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openjournal"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
